<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Store — Humble Shark</title>
    <meta name="description" content="Humble Shark for iPhone — free on the App Store." />
    <!-- Redirect stub: humbleshark.app/ios → the App Store listing. It exists
         so surfaces that display their URLs (Instagram's bio link page) show a
         short brand link while the campaign tags ride on the destination,
         invisibly. Deliberately noindex and absent from sitemap.xml, same as
         404.html — the store page is the canonical destination. -->
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Humble Shark for iPhone" />
    <meta
      property="og:description"
      content="Every asset. One quiet place. Free on the App Store."
    />
    <meta property="og:image" content="https://humbleshark.app/logo.png" />
    <link rel="icon" href="../favicon-32x32.png" sizes="32x32" />

    <!-- No-JS fallback goes to the untagged listing on purpose: one URL to
         maintain here, and scrapers/previews read the og tags, not this. -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6791254180" />
    </noscript>

    <style>
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/outfit-latin-700-normal.woff2') format('woff2');
      }
      :root {
        --paper: #fcfefd;
        --ink: #032748;
        --muted: #6b8ba3;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      p {
        margin: 0;
        font-weight: 700;
        font-size: 18px;
      }
      a {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <img src="../logo.png" alt="Humble Shark" />
    <p>Opening the App Store…</p>
    <a href="https://apps.apple.com/app/id6791254180"
      >If nothing happens, continue to the App Store.</a
    >
    <script>
      // ct names the campaign; pt is the provider token from App Store
      // Connect → App Analytics (campaign link generator). Empty PT still
      // redirects fine — installs just don't attribute until it's filled.
      // Any query on this page overrides the defaults, so one stub serves
      // every channel: humbleshark.app/ios?ct=poster etc.
      var PT = '';
      var p = new URLSearchParams({ ct: 'ig-bio' });
      if (PT) p.set('pt', PT);
      new URLSearchParams(location.search).forEach(function (v, k) {
        p.set(k, v);
      });
      location.replace('https://apps.apple.com/app/id6791254180?' + p);
    </script>
  </body>
</html>
